version: "3.9"

services:
  ui-1:
    build: .
    command:
      [
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--enable-network",
        "--node-name",
        "ui-1",
        "--p2p-port",
        "8545",
        "--discovery-port",
        "9999"
      ]
